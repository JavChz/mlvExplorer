name: Release Build Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.0.1)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Determine Version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.tag }}" -ne "") {
            $ver = "${{ github.event.inputs.tag }}"
          } elseif ($env:GITHUB_REF_NAME -match '^v?(.+)$') {
            $ver = "v$($Matches[1])"
          } else {
            $toml = Get-Content "Cargo.toml" -Raw
            if ($toml -match '(?m)^version\s*=\s*"([^"]+)"') {
              $ver = "v$($Matches[1])"
            } else {
              $ver = "v0.0.1"
            }
          }
          Write-Host "Resolved Version: $ver"
          "RELEASE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package Windows Zip Archive
        shell: pwsh
        run: |
          $ver = $env:RELEASE_VERSION
          $pkgName = "mlv-explorer-$ver-windows-x64"
          $staging = "staging\$pkgName"
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\mlv-explorer.exe" -Destination "$staging\mlv-explorer.exe"
          Copy-Item "README.md" -Destination "$staging\README.md"
          Copy-Item "LICENSE" -Destination "$staging\LICENSE"
          
          New-Item -ItemType Directory -Path "dist" -Force | Out-Null
          Compress-Archive -Path "$staging\*" -DestinationPath "dist\$pkgName.zip" -CompressionLevel Optimal

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: dist/*.zip

  build-linux:
    name: Build Linux x64 (.tar.gz & .AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libudev-dev \
            pkg-config \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libgtk-3-dev \
            wget \
            file

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Determine Version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VER="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF_NAME" =~ ^v?(.+)$ ]]; then
            VER="v${BASH_REMATCH[1]}"
          else
            CARGO_VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
            VER="v${CARGO_VER}"
          fi
          echo "Resolved Version: ${VER}"
          echo "RELEASE_VERSION=${VER}" >> $GITHUB_ENV

      - name: Build Release Binary
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Package Linux tar.gz Archive
        run: |
          VER="${{ env.RELEASE_VERSION }}"
          PKG_NAME="mlv-explorer-${VER}-linux-x64"
          STAGING="staging/${PKG_NAME}"
          mkdir -p "${STAGING}" "dist"
          
          cp target/x86_64-unknown-linux-gnu/release/mlv-explorer "${STAGING}/"
          chmod +x "${STAGING}/mlv-explorer"
          cp README.md "${STAGING}/"
          cp LICENSE "${STAGING}/"
          
          tar -czvf "dist/${PKG_NAME}.tar.gz" -C staging "${PKG_NAME}"
          rm -rf "${STAGING}"

      - name: Package Linux AppImage
        run: |
          VER="${{ env.RELEASE_VERSION }}"
          APPDIR="AppDir"
          mkdir -p "${APPDIR}/usr/bin"
          mkdir -p "${APPDIR}/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "${APPDIR}/usr/share/applications"
          
          cp target/x86_64-unknown-linux-gnu/release/mlv-explorer "${APPDIR}/usr/bin/mlv-explorer"
          chmod +x "${APPDIR}/usr/bin/mlv-explorer"
          
          cp assets/mlv-explorer.desktop "${APPDIR}/mlv-explorer.desktop"
          cp assets/mlv-explorer.desktop "${APPDIR}/usr/share/applications/mlv-explorer.desktop"
          cp assets/icons/mlv-explorer.png "${APPDIR}/mlv-explorer.png"
          cp assets/icons/mlv-explorer.png "${APPDIR}/usr/share/icons/hicolor/256x256/apps/mlv-explorer.png"
          
          cat << 'EOF' > "${APPDIR}/AppRun"
#!/bin/sh
SELF=$(readlink -f "$0")
HERE=${SELF%/*}
export PATH="${HERE}/usr/bin/:${PATH}"
export LD_LIBRARY_PATH="${HERE}/usr/lib/:${LD_LIBRARY_PATH}"
exec "${HERE}/usr/bin/mlv-explorer" "$@"
EOF
          chmod +x "${APPDIR}/AppRun"
          
          # Download appimagetool
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run "${APPDIR}" "dist/mlv-explorer-${VER}-x86_64.AppImage"
          rm -rf "${APPDIR}" appimagetool

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/*.tar.gz
            dist/*.AppImage

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            VER="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF_NAME" =~ ^v?(.+)$ ]]; then
            VER="v${BASH_REMATCH[1]}"
          else
            CARGO_VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
            VER="v${CARGO_VER}"
          fi
          echo "RELEASE_TAG=${VER}" >> $GITHUB_ENV

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Display release assets
        run: ls -lh release-assets/

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "Release ${{ env.RELEASE_TAG }}"
          files: |
            release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
