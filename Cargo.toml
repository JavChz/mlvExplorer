[package]
name = "mlv-explorer"
version = "0.1.0"
edition = "2021"
authors = ["mlvExplorer Contributors"]
description = "High-performance Catalog, player, and organizer for Magic Lantern RAW Videos (.mlv)"

[dependencies]
# UI & Windowing
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image", "all_loaders"] }

# Database
rusqlite = { version = "0.32", features = ["bundled", "backup", "blob"] }

# Serialization & Export
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Concurrency & Async
rayon = "1.10"
parking_lot = "0.12"
crossbeam-channel = "0.5"

# File System & Utilities
walkdir = "2.5"
rfd = "0.15" # Native file dialogs for Import/Backup
open = "5.3" # Open containing folder in file explorer
chrono = { version = "0.4", features = ["serde"] }
byteorder = "1.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
