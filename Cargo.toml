[package]
name = "mlv-explorer"
version = "0.2.0"
edition = "2021"
authors = ["mlvExplorer Contributors"]
description = "High-performance Photo browser-style catalog, player, and organizer for Magic Lantern RAW Videos (.mlv)"
default-run = "mlv-explorer"

[dependencies]
# UI & GPU (wgpu backend: Vulkan / DX12 / Metal — works on NVIDIA, AMD, Intel)
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
egui = "0.29"
bytemuck = { version = "1.16", features = ["derive"] }

# Database
rusqlite = { version = "0.32", features = ["bundled", "backup", "blob"] }

# Serialization & Export
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Concurrency
rayon = "1.10"
crossbeam-channel = "0.5"

# File System & Utilities
walkdir = "2.5"
rfd = "0.15"
open = "5.3"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

# Keep decoding fast even in debug builds
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
